<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>crab with knife</title>
<link rel="icon" type="image/png" sizes="32x32" href="./assets/200px.png">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Video Source */
    #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -3;
    }

    /* Dark Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: -2;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* ✅ HERO TITLE LAYOUT */
    .hero {
      text-align: center;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
    }

    .title-row h1 {
      font-size: 3.5rem;
      margin: 0;
      letter-spacing: 2px;
    }

    .title-row img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #1f2937;
    }

    p.subtitle {
      color: #94a3b8;
      margin-top: 10px;
      margin-bottom: 25px;
    }

    @media (max-width: 768px) {
      .title-row {
        flex-wrap: wrap;
      }

      .title-row h1 {
        font-size: 2.5rem;
      }

      .title-row img {
        width: 55px;
        height: 55px;
      }
    }

    /* 🔴 RED BUTTONS */
    .btn {
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      transition: 0.2s;
      color: white;
      background: #dc2626;
      border: none;
    }

    .btn:hover {
      background: #b91c1c;
    }

    .cta-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }

    /* 📊 CHART */
    .chart-wrapper {
      margin: 40px auto;
      width: 100%;
      max-width: 1100px;
      height: 800px;

      border-radius: 16px;
      overflow: hidden;

      background: #0b0f1a;
      border: 1px solid #1f2937;

      box-shadow: 0 25px 70px rgba(0,0,0,0.65);
      position: relative;
    }

    @media (max-width: 768px) {
      .chart-wrapper {
        height: 380px;
      }
    }

    .chart-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      filter: none;
    }

  </style>
</head>

<body>

<!-- 🎥 BACKGROUND VIDEO -->
<video autoplay muted loop playsinline id="bg-video">
  <source src="./assets/crabwithknife_original%20video.mp4" type="video/mp4">
</video>

<!-- 🦀 MOVING CRAB -->
<div class="crab">🦀</div>

<div class="container">

  <!-- HERO -->
  <div class="hero">
    <div class="title-row">
      <h1>crab with knife</h1>
      <img src="./assets/200px.png" alt="Crab Logo">
    </div>

    <p class="subtitle">Literally just a crab with a knife.</p>
  </div>

  <!-- CTA BUTTONS -->
  <div class="cta-buttons">
    <a class="btn" href="https://discord.gg/xPN4CUfER7" target="_blank">Join Discord</a>
    <a class="btn" href="https://obsidian.finance/?outputCurrency=0xC84398E9BBBC028BA81e61D2c45194049D0173Ef" target="_blank">Buy on Obsidian Finance</a>
    <a class="btn" href="https://wolfswap.app/swap?chainId=25&sellToken=0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE&buyToken=0xC84398E9BBBC028BA81e61D2c45194049D0173Ef" target="_blank">Buy on WolfSwap</a>
    <a class="btn" href="https://vvs.finance/trade/swap?inputCurrency=cro&outputCurrency=0xC84398E9BBBC028BA81e61D2c45194049D0173Ef&exactAmount=0&exactField=input" target="_blank">Buy on VVS Finance</a>
    <a class="btn" href="https://www.puush.fun/" target="_blank">Buy on Puush.fun Swap</a>
  </div>

  <!-- 📊 LIVE CHART -->
  <div class="chart-wrapper">
    <iframe
      src="https://dexscreener.com/cronos/0xdf9030e28cde0f4e6f11c65362c5e152093c7414?embed=1&theme=dark"
      frameborder="0">
    </iframe>
  </div>

</div>

</body>
</html>
