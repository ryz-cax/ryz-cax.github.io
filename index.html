<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>crab with knife</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/200px.png">

  <style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #ffffff;
    overflow-x: hidden;
  }

  #bg-video {
    position: fixed;
    right: 0;
    bottom: 0;
    min-width: 100%;
    min-height: 100%;
    object-fit: cover;
    z-index: -3;
  }

  body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: -2;
  }

  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 60px 20px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .hero {
    text-align: center;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
  }

  .title-row h1 {
    font-size: 3.5rem;
    margin: 0;
    letter-spacing: 2px;
  }

  .title-row img {
    width: 70px;
    height: 70px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid #1f2937;
  }

  p.subtitle {
    color: #94a3b8;
    margin-top: 10px;
    margin-bottom: 25px;
  }

  @media (max-width: 768px) {
    .title-row {
      flex-wrap: wrap;
    }

    .title-row h1 {
      font-size: 2.5rem;
    }

    .title-row img {
      width: 55px;
      height: 55px;
    }
  }

  /* 🔴 FIXED BUTTON STYLE (ICON + TEXT READY) */
  .btn {
    padding: 12px 18px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
    color: white;
    background: #dc2626;
    border: none;
    cursor: pointer;
  }

  .btn:hover {
    background: #b91c1c;
  }

  .cta-buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 30px;
  }

  /* 🔽 DROPDOWN */
  .cta-dropdown {
    position: relative;
    display: inline-block;
  }

  .dropdown-menu {
    display: none;
    position: absolute;
    top: 110%;
    left: 0;
    background: #111;
    border-radius: 10px;
    min-width: 240px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    overflow: hidden;
    z-index: 1000;
  }

  .dropdown-menu a {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    text-decoration: none;
    color: #fff;
    transition: 0.2s;
  }

  .dropdown-menu a:hover {
    background: #222;
  }

  .dropdown-menu img {
    width: 20px;
    height: 20px;
  }

  /* 📊 CHART */
  .chart-wrapper {
    margin: 40px auto;
    width: 100%;
    max-width: 1100px;
    height: 800px;
    border-radius: 16px;
    overflow: hidden;
    background: #0b0f1a;
    border: 1px solid #1f2937;
    box-shadow: 0 25px 70px rgba(0,0,0,0.65);
    position: relative;
  }

  @media (max-width: 768px) {
    .chart-wrapper {
      height: 380px;
    }
  }

  .chart-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
</style>
</head>

<body>

<video autoplay muted loop playsinline id="bg-video">
  <source src="./assets/crabwithknife_original%20video.mp4" type="video/mp4">
</video>

<div class="container">

  <div class="hero">
    <div class="title-row">
      <h1>crab with knife</h1>
      <img src="./assets/200px.png" alt="Crab Logo">
    </div>

    <p class="subtitle">Literally just a crab with a knife.</p>
  </div>

 
<!-- ✅ CTA -->
<div class="cta-buttons">
  <a class="btn" href="https://discord.gg/xPN4CUfER7" target="_blank">
    Discord
  </a>

  <a class="btn" href="https://www.geckoterminal.com/cro/pools/0xdf9030e28cde0f4e6f11c65362c5e152093c7414" target="_blank">
    <img src="./assets/geckoterminal_favicon.png" alt="GeckoTerminal">
    <span>GeckoTerminal</span>
  </a>

  <div class="cta-dropdown">
    <button class="btn dropdown-toggle">Buy CRAB ▾</button>

    <div class="dropdown-menu">
      <a href="https://obsidian.finance/?outputCurrency=0xC84398E9BBBC028BA81e61D2c45194049D0173Ef" target="_blank">
        <img src="./assets/Obsidian_Finance.png">
        <span>Obsidian Finance</span>
      </a>

      <a href="https://wolfswap.app/swap?chainId=25&sellToken=0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE&buyToken=0xC84398E9BBBC028BA81e61D2c45194049D0173Ef" target="_blank">
        <img src="./assets/Wolfswap.png">
        <span>WolfSwap</span>
      </a>

      <a href="https://vvs.finance/trade/swap?inputCurrency=cro&outputCurrency=0xC84398E9BBBC028BA81e61D2c45194049D0173Ef&exactAmount=0&exactField=input" target="_blank">
        <img src="./assets/VVS_icon.png">
        <span>VVS Finance</span>
      </a>

      <a href="https://www.puush.fun/" target="_blank">
        <img src="./assets/Puush_icon.png">
        <span>Puush.fun</span>
      </a>

      <a href="https://www.geckoterminal.com/cro/pools/0xdf9030e28cde0f4e6f11c65362c5e152093c7414" target="_blank">
        <img src="./assets/geckoterminal_favicon.png">
        <span>GeckoTerminal</span>
      </a>
    </div>
  </div>
</div>

  <!-- 📊 CHART -->
  <div class="chart-wrapper">
    <iframe src="https://dexscreener.com/cronos/0xdf9030e28cde0f4e6f11c65362c5e152093c7414?embed=1&theme=dark"></iframe>
  </div>

</div>

<script>
  const toggle = document.querySelector('.dropdown-toggle');
  const menu = document.querySelector('.dropdown-menu');

  toggle.addEventListener('click', () => {
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  });

  window.addEventListener('click', (e) => {
    if (!e.target.closest('.cta-dropdown')) {
      menu.style.display = 'none';
    }
  });
</script>

</body>
</html>
