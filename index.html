<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Crab With Knife</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Video Source */
    #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      z-index: -3;
    }

    /* Dark Overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: -2;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    p.subtitle {
      color: #94a3b8;
      margin-bottom: 25px;
    }

    /* 🔴 RED BUTTONS */
    .btn {
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      display: inline-block;
      transition: 0.2s;
      color: white;
      background: #dc2626;
      border: none;
    }

    .btn:hover {
      background: #b91c1c;
    }

    .cta-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 30px;
    }

    /* 📊 CHART */
    .chart-wrapper {
  margin: 40px auto;
  width: 100%;
  height: 800px; 
  max-width: 1000px;

  border-radius: 12px;
  overflow: hidden;
  border: 1px solid #1f2937;
}

/* 📱 MOBILE OVERRIDE */
@media (max-width: 768px) {
  .chart-wrapper {
    height: 380px !important; 
  }
}

    /* 🦀 ANIMATED CRAB */
    .crab {
      position: fixed;
      bottom: 20px;
      left: -200px;
      width: 120px;
      z-index: 5;
      animation: crabMove 12s linear infinite;
      pointer-events: none;
    }

    @keyframes crabMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(120vw); }
    }

  </style>
</head>
