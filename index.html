<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crab With Knife</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: #ffffff;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px;
      text-align: center;
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    p.subtitle {
      font-size: 1.2rem;
      color: #94a3b8;
      margin-bottom: 30px;
    }

    /* 🦀 HERO IMAGE */
    .hero-img {
      width: 100%;
      max-width: 420px;
      border-radius: 16px;
      margin: 20px auto 40px auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      display: block;
    }

    .cta-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-bottom: 40px;
    }

    .btn {
      padding: 12px 18px;
      border-radius: 10px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: 0.2s;
      display: inline-block;
    }

    .primary {
      background: #38bdf8;
      color: #0f172a;
    }

    .primary:hover {
      background: #0ea5e9;
    }

    .secondary {
      background: #1f2937;
      border: 1px solid #334155;
    }

    .secondary:hover {
      background: #111827;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 40px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 20px;
      text-align: left;
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 1.1rem;
    }

    /* 🔘 BUTTON STYLE FOR LINKS */
    .card a {
      display: inline-block;
      background: #38bdf8;
      color: #0f172a;
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .card a:hover {
      background: #0ea5e9;
    }

    footer {
      margin-top: 60px;
      color: #64748b;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Crab With Knife</h1>

    <p class="subtitle">
      A community-driven token with sharp utility and even sharper memes.
    </p>

    <!-- 🦀 IMAGE -->
    <img 
      class="hero-img"
      src="https://cdn.dexscreener.com/cms/images/4905d85bb3a8cf060ba7216832588c0fd03a0e0698b6d7511b8f8b73e0836b76?width=128&height=128&fit=crop&quality=95&format=auto"
      alt="Crab With Knife"
    />

    <!-- CTA -->
    <div class="cta-buttons">
      <a class="btn primary" href="https://discord.gg/xPN4CUfER7" target="_blank">
        Join Discord
      </a>
      <a class="btn secondary" href="https://obsidian.finance/?outputCurrency=0xC84398E9BBBC028BA81e61D2c45194049D0173Ef" target="_blank">
        Buy on Obsidian
      </a>
    </div>

    <!-- Trading Links -->
    <div class="grid">

      <div class="card">
        <h3>Obsidian Finance</h3>
        <a href="https://obsidian.finance/?outputCurrency=0xC84398E9BBBC028BA81e61D2c45194049D0173Ef" target="_blank">
          Trade Now
        </a>
      </div>

      <div class="card">
        <h3>WolfSwap</h3>
        <a href="https://wolfswap.app/swap?chainId=25&sellToken=0xEeeeeEeeeEeEeeEeEeEeeEEEeeeeEeeeeeeeEEeE&buyToken=0xC84398E9BBBC028BA81e61D2c45194049D0173Ef" target="_blank">
          Swap CRAB
        </a>
      </div>

      <div class="card">
        <h3>VVS Finance</h3>
        <a href="https://vvs.finance/trade/swap?inputCurrency=cro&outputCurrency=0xC84398E9BBBC028BA81e61D2c45194049D0173Ef&exactAmount=0&exactField=input" target="_blank">
          Trade CRAB
        </a>
      </div>

      <div class="card">
        <h3>Community</h3>
        <a href="https://discord.gg/xPN4CUfER7" target="_blank">
          Join Discord
        </a>
      </div>

    </div>

    <footer>
      © Crab With Knife • Built on GitHub Pages
    </footer>

  </div>

</body>
</html>
